   name: Simulation VHDL

   on:
     push:
     pull_request:

   jobs:
     simulation:
       runs-on: ubuntu-24.04
       steps:
         - name: Recuperer le code
           uses: actions/checkout@v4

         - name: Installer GHDL
           run: sudo apt-get update && sudo apt-get install -y ghdl

         - name: Lancer les testbenches
           run: bash scripts/run_sim.sh
